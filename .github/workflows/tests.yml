name: Tests

on:
  push:
  pull_request:

jobs:
  pest:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
        dependencies: [lowest, stable]

    name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --prefer-${{ matrix.dependencies }}

      - name: Run Pest
        run: vendor/bin/pest
